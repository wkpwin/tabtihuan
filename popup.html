<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>书签URL替换</title>
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: Arial, sans-serif;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <div class="form-group">
    <label for="folderSelect">选择文件夹：</label>
    <select id="folderSelect">
      <option value="all">所有书签</option>
    </select>
  </div>
  <div class="form-group">
    <label for="findPattern">查找模式：</label>
    <input type="text" id="findPattern" placeholder="输入要查找的URL部分">
  </div>
  <div class="form-group">
    <label for="replacePattern">替换为：</label>
    <input type="text" id="replacePattern" placeholder="输入替换内容">
  </div>
  <button id="replaceBtn">执行替换</button>

  <div id="message" style="margin-top: 15px;"></div>

  <script src="popup.js"></script>
</body>
</html>
